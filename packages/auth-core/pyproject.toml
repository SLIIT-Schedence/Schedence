[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "schedence-auth-core"
version = "0.1.0"
description = "Shared AWS Cognito access-token verification (JWKS caching, issuer, client and token_use checks) for Schedence FastAPI services."
requires-python = ">=3.11"
dependencies = [
    "pyjwt[crypto]>=2.10,<3",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/schedence_auth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
