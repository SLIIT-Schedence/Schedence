# Identity Service: accounts, Cognito integration, system roles and permissions.
#
# This is an application, not an installable library: run it from this directory
# (see README.md). Every Schedence service uses the top-level package name "app",
# so services must not be pip-installed side by side into one environment.
#
# Local development (repository root, root .venv):
#   python -m pip install -e ./packages/db-core -e ./packages/auth-core   # shared packages first (not on PyPI)
#   python -m pip install --group services/identity-service/pyproject.toml:dev

[dependency-groups]
runtime = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy[asyncio]>=2.0.36,<2.2",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "pydantic[email]>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "boto3>=1.35,<2",
    "pyjwt[crypto]>=2.10,<3",
    "httpx>=0.27,<1",
]
dev = [
    { include-group = "runtime" },
    "pytest>=8.3",
    "pytest-asyncio>=1.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
