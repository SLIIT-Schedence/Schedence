# Alembic configuration for the Identity Service (schema "identity").
#
# There is deliberately no sqlalchemy.url here: alembic/env.py gets the URL from
# schedence_db.load_settings() (DIRECT_DATABASE_URL, falling back to DATABASE_URL),
# so credentials never live in this file.
#
# Preview SQL without connecting:   alembic upgrade head --sql
# Apply (after review/approval):    alembic upgrade head

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
