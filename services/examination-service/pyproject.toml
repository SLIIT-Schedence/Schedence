[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "schedence-examination-service"
version = "0.1.0"
description = "Schedence Examination Service: examination timetabling and cognitive load optimization."
requires-python = ">=3.11"
dependencies = [
    # Install from this repository first (not published on PyPI):
    #   python -m pip install -e ./packages/db-core -e ./packages/auth-core
    "schedence-db-core",
    "schedence-auth-core",
    "httpx>=0.27,<1",  # Identity Service permission lookups
    "sqlalchemy[asyncio]>=2.0.36,<2.2",
    "alembic>=1.13,<2",
    # Tested with FastAPI 0.143 (Starlette 1.x) and uvicorn 0.54.
    "fastapi>=0.143,<1",
    "uvicorn>=0.54,<1",
]

[project.optional-dependencies]
solver = [
    "ortools==9.15.6755",  # offline CP-SAT; deliberately separate from API runtime
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.4",
    "httpx2>=2.0,<3",  # FastAPI TestClient (Starlette 1.x)
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
markers = [
    "live: talks to the real configured database (opt-in: pytest --live)",
]
