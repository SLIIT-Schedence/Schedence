[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "schedence-resource-service"
version = "0.1.0"
description = "Resource-owned venue inventory and its read-only export API."
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0.36,<2.2",
    "alembic>=1.14,<2",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "schedence-db-core>=0.1.0,<0.2",
    "schedence-auth-core>=0.1.0,<0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/schedence_resource"]
